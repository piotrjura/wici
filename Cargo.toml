[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/piotrjura/wici"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hkdf = "0.12"
proptest = "1"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
wici-client = { path = "crates/wici-client" }
wici-crypto = { path = "crates/wici-crypto" }
wici-protocol = { path = "crates/wici-protocol" }
wici-server = { path = "crates/wici-server" }
wici-testkit = { path = "crates/wici-testkit" }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Production code must not panic or hide errors.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
mem_forget = "deny"
# Debug output belongs in tests or in structured logs.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Readability and explicit intent.
cognitive_complexity = "deny"
wildcard_enum_match_arm = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "deny"
str_to_string = "deny"
redundant_clone = "deny"
needless_collect = "deny"
missing_const_for_fn = "deny"
use_self = "deny"
